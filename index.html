<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abrir Casamento ou App Igreja</title>
    <meta name="description" content="Página simples com links para Casamento e App Igreja." />
    <style>
      :root {
        color-scheme: dark;
        color: #f8fafc;
        background: #07111f;
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        min-height: 100%;
      }
      body {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top left, rgba(62, 224, 232, 0.16), transparent 28%),
                    radial-gradient(circle at bottom right, rgba(167, 139, 250, 0.18), transparent 30%),
                    linear-gradient(180deg, #09121f 0%, #05111a 100%);
      }
      .card {
        width: min(100%, 520px);
        padding: 32px 28px;
        border-radius: 28px;
        background: rgba(12, 18, 36, 0.88);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.34);
        border: 1px solid rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(16px);
      }
      .title {
        margin: 0 0 18px;
        font-size: clamp(2rem, 4vw, 3rem);
        line-height: 1.03;
        letter-spacing: -0.04em;
      }
      .description {
        margin: 0 0 28px;
        color: #b1c2d5;
        font-size: 1rem;
        line-height: 1.8;
      }
      .buttons {
        display: grid;
        gap: 16px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 16px 20px;
        border-radius: 18px;
        text-decoration: none;
        font-weight: 700;
        font-size: 1rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      }
      .button.primary {
        background: linear-gradient(135deg, #34d0ff, #4c7cff);
        color: #07111f;
        box-shadow: 0 18px 30px rgba(52, 208, 255, 0.2);
      }
      .button.secondary {
        background: rgba(255, 255, 255, 0.08);
        color: #e8f1fa;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .button:hover {
        transform: translateY(-2px);
        box-shadow: 0 22px 40px rgba(0, 0, 0, 0.25);
      }
      .note {
        margin-top: 24px;
        color: #8fa6c0;
        font-size: 0.94rem;
      }
      @media (max-width: 520px) {
        .card {
          padding: 24px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 class="title">Bem-vindos</h1>
      <p class="description">Abra direto o site de casamento ou o app da igreja. Apenas os links principais e um visual limpo para facilitar o acesso.</p>
      <div class="buttons">
        <a class="button primary" href="/casamento/">Abrir Casamento</a>
        <a class="button secondary" href="/appigreja/">Abrir App Igreja</a>
      </div>
      <p class="note">Se quiser, posso deixar a página ainda mais simples com só um botão e texto reduzido.</p>
    </div>
  </body>
</html>
