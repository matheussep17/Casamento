name: Sync to site repo

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone destination repository
        env:
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${SITE_REPO_TOKEN}@github.com/matheussep17/site.git /tmp/site-repo
          cd /tmp/site-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Mirror files to destination repository
        run: |
          rsync -a --delete --exclude '.git/' --exclude '.github/' ./ /tmp/site-repo/
          cd /tmp/site-repo
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "Sync from Casamento"
          git push origin HEAD:master
